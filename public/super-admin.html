<!DOCTYPE html>
<html>
<head>
    <title>Super Admin — Restaurants</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23A8371E'/><text x='50' y='68' font-size='58' fill='%23FAF6EE' text-anchor='middle' font-family='sans-serif' font-weight='800'>M</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="staff-header">
        <h1>Super Admin</h1>
        <p>Manage all restaurants on Meza</p>
    </div>

    <div class="staff-body">
        <div class="section-heading">Add a Restaurant</div>
        <div class="panel">
            <div class="field-group">
                <label>Restaurant name</label>
                <input type="text" id="new-restaurant-name" placeholder="e.g. La Casemia Restaurant">
            </div>
            <button class="btn-success" onclick="addRestaurant()">Add restaurant</button>
        </div>

        <div class="panel" id="edit-form" style="display:none;">
            <div class="section-heading">Edit Restaurant</div>
            <input type="hidden" id="edit-id">
            <div class="field-group"><label>Name</label><input type="text" id="edit-name"></div>
            <button class="btn-success" onclick="saveEdit()">Save changes</button>
            <button class="btn-ghost" onclick="cancelEdit()">Cancel</button>
        </div>

        <div class="section-heading">Current Restaurants</div>
        <div id="restaurant-list"></div>
    </div>

    <script>
        function loadRestaurants() {
            fetch('/restaurants')
                .then(response => response.json())
                .then(restaurants => {
                    const container = document.getElementById('restaurant-list');
                    container.innerHTML = '';
                    if (restaurants.length === 0) {
                        container.innerHTML = '<div class="empty-state">No restaurants yet.</div>';
                        return;
                    }
                    restaurants.forEach(r => {
                        const div = document.createElement('div');
                        div.className = 'list-row';
                        div.innerHTML = `
                            <div class="list-row-info">
                                <strong>${r.name}</strong> <span style="color:var(--muted);font-weight:400;">(ID: ${r.id})</span><br>
                                <span style="font-size:12px;color:var(--muted);">Customer: meza-app.rw/?restaurant=${r.id}&table=1</span><br>
                                <span style="font-size:12px;color:var(--muted);">Admin: meza-app.rw/admin.html?restaurant=${r.id}</span>
                                <span style="font-size:12px;color:var(--muted);">Staff login: meza-app.rw/staff-login.html?restaurant=${r.id}</span>
                            </div>
                            <div class="list-row-actions">
                                <button class="btn-ghost" onclick="editRestaurant(${r.id}, '${r.name}')">Edit</button>
                                <button class="btn-danger" onclick="deleteRestaurant(${r.id})">Delete</button>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                });
        }

        function addRestaurant() {
            const name = document.getElementById('new-restaurant-name').value;
            fetch('/restaurants', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('new-restaurant-name').value = '';
                loadRestaurants();
            });
        }

        function editRestaurant(id, name) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-form').style.display = 'block';
        }

        function cancelEdit() {
            document.getElementById('edit-form').style.display = 'none';
        }

        function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            fetch('/restaurants/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            }).then(() => {
                document.getElementById('edit-form').style.display = 'none';
                loadRestaurants();
            });
        }

        function deleteRestaurant(id) {
            if (confirm('Delete this restaurant? This will also delete its menu and orders permanently.')) {
                fetch('/restaurants/' + id, { method: 'DELETE' }).then(() => loadRestaurants());
            }
        }

        loadRestaurants();
    </script>
</body>
</html>
