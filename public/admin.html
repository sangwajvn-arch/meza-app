<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meza — Venue workspace</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23A8371E'/><text x='50' y='68' font-size='58' fill='%23FAF6EE' text-anchor='middle' font-family='sans-serif' font-weight='800'>M</text></svg>">
  <style>
:root { --admin-page: var(--bone); --admin-panel: #fff; --admin-sidebar: var(--ink); --admin-line: var(--border); }

html, body {
    width: 100vw; height: 100vh; margin: 0; padding: 0;
    max-width: none; max-height: none; overflow-x: hidden;
    background: var(--admin-page); color: var(--ink);
}

.meza-app, .meza-app * {
    box-sizing: border-box; max-width: none; background: none; border: none; border-radius: 0;
    margin: 0; padding: 0; color: inherit; font-size: inherit; font-weight: inherit; text-align: left;
}

.meza-app { display: grid; grid-template-columns: 230px minmax(0,1fr); width: 100vw; min-height: 100vh; }

.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; background: var(--admin-sidebar); color: var(--bone); }
.brand { display: flex; align-items: center; gap: 9px; margin-bottom: 25px; color: var(--bone); font-size: 19px; font-weight: 800; }
.brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--rust); color: var(--bone); font-size: 15px; }
.venue-chip { display: block; padding: 10px 11px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; background: rgba(255,255,255,.06); color: var(--bone); font-size: 11px; font-weight: 800; text-transform: uppercase; }
.nav-section { margin: 22px 9px 8px; color: rgba(250,246,238,.44); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; margin: 2px 0; border-radius: 8px; background: transparent; color: rgba(250,246,238,.72); cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; }
.nav-item:hover { background: rgba(224,163,46,.14); color: var(--bone); }
.nav-item.active { background: var(--rust); color: var(--bone); }

.main { width: 100%; min-height: 100vh; padding: 24px 32px 70px; color: var(--ink); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 20px; margin-bottom: 26px; border-bottom: 1px solid var(--admin-line); }
.crumb { flex: 1; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.signout { border: 1px solid var(--admin-line); border-radius: 8px; background: transparent; color: var(--ink); padding: 9px 12px; cursor: pointer; font: inherit; font-size: 11px; font-weight: 800; }
#fullscreen-btn { border: 1px solid var(--admin-line); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
#screen { width: 100%; color: var(--ink); }

.hero { padding: 30px; margin-bottom: 24px; border-radius: 14px; background: linear-gradient(125deg, var(--forest), var(--ink)); border-left: 6px solid var(--rust); color: var(--bone); }
.hero h1 { color: var(--bone); font-size: 28px; font-weight: 800; }
.hero p { margin: 7px 0 17px; color: rgba(250,246,238,.72); font-size: 12px; }
.pill { display: inline-block; padding: 7px 10px; border-radius: 99px; background: rgba(255,255,255,.1); color: var(--bone); font-size: 10px; font-weight: 800; margin-right: 8px; }

.section-label { margin: 25px 0 10px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.metric, .card { padding: 18px; border: 1px solid var(--admin-line); border-radius: 12px; background: var(--admin-panel); color: var(--ink); }
.metric { border-top: 3px solid var(--gold); }
.metric-label { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
.metric-value { margin-top: 8px; font-size: 26px; font-weight: 800; color: var(--ink); }
.metric-note { margin-top: 4px; color: var(--muted); font-size: 11px; }

.screen-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; }
.screen-title { font-size: 26px; font-weight: 800; color: var(--ink); }
.screen-head p { margin-top: 5px; color: var(--muted); font-size: 12px; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-grid .wide { grid-column: 1 / -1; }
.field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
.field input, .field select { width: 100%; padding: 10px 11px; border: 1px solid var(--admin-line); border-radius: 8px; background: var(--bone); color: var(--ink); font: inherit; font-size: 12px; }
.field input:focus, .field select:focus { border-color: var(--rust); }

.button-row { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.primary, .secondary, .danger { padding: 9px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 800; }
.primary { background: var(--rust); color: var(--bone); }
.secondary { background: var(--bone); color: var(--ink); border: 1px solid var(--admin-line); }
.danger { background: #fff0ef; color: var(--rust); }

.list { display: grid; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border: 1px solid var(--admin-line); border-radius: 10px; background: var(--admin-panel); }
.row-title { font-size: 13px; font-weight: 800; color: var(--ink); }
.row-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
.row-actions { display: flex; gap: 8px; }
.status { display: inline-block; padding: 4px 7px; border-radius: 99px; font-size: 9px; font-weight: 800; text-transform: uppercase; margin-left: 8px; }
.pending, .awaiting_payment, .awaiting_confirmation { background: #fff1d3; color: #936000; }
.approved { background: #efe9de; color: var(--rust); }
.ready, .done { background: #e4f1df; color: var(--forest); }
.void, .rejected { background: #fff0ef; color: var(--rust); }
.empty { padding: 28px; border: 1px dashed var(--admin-line); border-radius: 10px; color: var(--muted); font-size: 12px; text-align: center; }
.toast { position: fixed; right: 22px; bottom: 22px; padding: 12px 15px; border-radius: 9px; background: var(--ink); color: var(--bone); font-size: 12px; font-weight: 700; z-index: 200; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,23,18,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--admin-panel); border-radius: 14px; padding: 26px; width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto; color: var(--ink); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-head h2 { font-size: 19px; font-weight: 800; }
.modal-close { background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
.recipe-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.recipe-row select, .recipe-row input { padding: 10px 11px; border: 1px solid var(--admin-line); border-radius: 8px; background: var(--bone); color: var(--ink); font-size: 12px; }
.recipe-row-remove { background: none; color: var(--rust); font-size: 18px; cursor: pointer; padding: 0 6px; }

.billing-wrap { max-width: 900px; }
.billing-card { padding: 22px; border: 1px solid #2a382c; border-radius: 14px; background: #1b261e; color: #ffffff; }
.billing-top { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 18px; border-bottom: 1px solid #2a382c; }
.billing-label { color: #a3a8a4; font-size: 9px; font-weight: 800; text-transform: uppercase; }
.billing-plan-name { margin-top: 5px; font-size: 20px; font-weight: 800; color: #fffde8; }
.billing-subtext { margin-top: 3px; color: #a3a8a4; font-size: 11px; }
.billing-status { padding: 6px 10px; border-radius: 99px; background: #2d312e; color: #ffffff; font-size: 10px; font-weight: 800; }
.plan-list { display: grid; gap: 8px; margin-top: 12px; }
.plan-option { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 13px; border: 1px solid #2a382c; border-radius: 10px; background: #151e18; color: #ffffff; }
.plan-option.current { border-color: #fffde8; background: #233227; }
.plan-name { font-size: 13px; font-weight: 800; color: #ffffff; }
.current-text { margin-left: 5px; color: #fffde8; font-size: 9px; font-weight: 800; }
.plan-description { margin-top: 3px; color: #a3a8a4; font-size: 10px; }
.billing-footnote { margin-top: 14px; color: #a3a8a4; font-size: 10px; }

.team-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.team-row { flex-wrap: wrap; }
.team-main { flex: 1 1 220px; min-width: 0; }
.team-contact { margin-top: 6px; font-size: 12px; font-weight: 700; }
.team-contact a { color: var(--rust); text-decoration: none; }
.team-none { color: var(--muted); font-weight: 400; }
.pin-chip { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--admin-line); background: var(--bone); color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 800; letter-spacing: .12em; white-space: nowrap; }
.team-edit { display: block; }

@media (max-width: 900px) {
    .meza-app { display: block; }
    .sidebar { position: static; height: auto; }
    .sidebar nav { display: flex; gap: 5px; overflow-x: auto; }
    .nav-section { display: none; }
    .main { padding: 16px; }
    .metric-grid, .form-grid { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
  <div class="meza-app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">M</span> Meza</div>
      <div class="venue-chip" id="venue-chip">Loading venue…</div>
      <nav>
        <div class="nav-section">Workspace</div>
        <button class="nav-item active" data-screen="overview" onclick="showScreen('overview')">Overview</button>
        <div class="nav-section">Service</div>
        <button class="nav-item" data-screen="orders" onclick="showScreen('orders')">Live orders</button>
        <button class="nav-item" data-screen="cashier" onclick="showScreen('cashier')">Cashier</button>
        <button class="nav-item" data-screen="qr" onclick="showScreen('qr')">QR Codes</button>
        <div class="nav-section">Operations</div>
        <button class="nav-item" data-screen="menu" onclick="showScreen('menu')">Menu</button>
        <button class="nav-item" data-screen="ingredients" onclick="showScreen('ingredients')">Inventory & Ingredients</button>
        <button class="nav-item" data-screen="team" onclick="showScreen('team')">Venue team</button>
        <div class="nav-section">Business</div>
        <button class="nav-item" data-screen="reports" onclick="showScreen('reports')">Reports</button>
        <button class="nav-item" data-screen="payments" onclick="showScreen('payments')">Payment Setup</button>
        <button class="nav-item" data-screen="billing" onclick="showScreen('billing')">Billing</button>
      </nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="crumb" id="breadcrumb">Venue workspace</div>
        <button id="fullscreen-btn" type="button" title="Toggle Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
        <button class="signout" onclick="signOut()">Sign out</button>
      </div>
      <section id="screen"></section>
    </main>
  </div>

  <div class="modal-overlay" id="dish-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modal-title">Add Dish</h2>
        <button class="modal-close" onclick="closeDishModal()">✕</button>
      </div>
      <div class="form-grid">
        <div class="field wide"><label>Dish ID</label><input id="modal-id" placeholder="e.g. fish"></div>
        <div class="field"><label>Name</label><input id="modal-name" placeholder="Dish name"></div>
        <div class="field"><label>Price (RWF)</label><input id="modal-price" type="number"></div>
        <div class="field wide"><label>Description</label><input id="modal-description" placeholder="Short description"></div>
        <div class="field"><label>Image URL</label><input id="modal-image" placeholder="https://..."></div>
        <div class="field"><label>Prep time (minutes)</label><input id="modal-prep-time" type="number" placeholder="e.g. 15"></div>
        <div class="field wide">
          <label>Category</label>
          <input id="modal-category" list="category-suggestions" placeholder="e.g. Grilled Food">
          <datalist id="category-suggestions"></datalist>
        </div>
      </div>
      <div class="section-label">Recipe / Ingredients — raw materials needed per 1 dish</div>
      <div id="modal-recipe-rows"></div>
      <div class="recipe-row">
        <select id="modal-new-ingredient" style="flex:2;"></select>
        <input id="modal-new-qty" type="number" step="0.01" placeholder="Qty per dish" style="flex:1;">
        <button class="secondary" onclick="addRecipeRow()">+ Add</button>
      </div>
      <div class="button-row" style="margin-top:20px;">
        <button class="secondary" onclick="closeDishModal()">Cancel</button>
        <button class="primary" onclick="saveDishModal()">Save Dish</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="ingredient-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="ingredient-modal-title">Add Ingredient</h2>
        <button class="modal-close" onclick="closeIngredientModal()">✕</button>
      </div>
      <div class="form-grid">
        <div class="field wide"><label>Name</label><input id="ing-modal-name" placeholder="e.g. Chicken breast"></div>
        <div class="field"><label>Unit</label><input id="ing-modal-unit" placeholder="kg, litres, pieces..."></div>
        <div class="field"><label>Quantity in stock</label><input id="ing-modal-qty" type="number" step="0.1"></div>
        <div class="field"><label>Low stock alert at</label><input id="ing-modal-low" type="number" step="0.1"></div>
        <div class="field"><label>Cost per unit (RWF)</label><input id="ing-modal-cost" type="number" step="0.01" placeholder="e.g. 6500"></div>
      </div>
      <div class="button-row" style="margin-top:20px;">
        <button class="secondary" onclick="closeIngredientModal()">Cancel</button>
        <button class="primary" onclick="saveIngredientModal()">Save Ingredient</button>
      </div>
    </div>
  </div>

  <script>
    let restaurantId;
    let restaurant = {};
    let modalRecipe = [];
    let modalIngredients = [];
    let modalEditingId = null;
    let ingredientEditingId = null;
    let reportFrom = '';
    let reportTo = '';

    const screen = document.getElementById('screen');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = value => `${Number(value || 0).toLocaleString()} RWF`;
    const formatDateTime = ms => new Date(ms).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    const isoDate = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

    const screenLabels = {
      overview: 'Overview', orders: 'Live orders', cashier: 'Cashier', qr: 'QR Codes', menu: 'Menu',
      ingredients: 'Inventory & Ingredients', team: 'Venue team', reports: 'Reports', payments: 'Payment Setup', billing: 'Billing'
    };
    const methodLabels = { momo: 'MTN MoMo', airtel: 'Airtel Money', urubuto: 'Urubuto Pay', card: 'Card', cash: 'Cash' };

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.error(err.message));
      else document.exitFullscreen();
    });

    async function api(url, options = {}) {
      const response = await fetch(url, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Something went wrong.');
      return data;
    }

    function toast(message) {
      document.querySelector('.toast')?.remove();
      const item = document.createElement('div');
      item.className = 'toast';
      item.textContent = message;
      document.body.appendChild(item);
      setTimeout(() => item.remove(), 2800);
    }

    function setActive(name) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
    }

    async function loadRestaurant() {
      restaurant = await api('/restaurants/' + restaurantId);
      document.getElementById('venue-chip').textContent = restaurant.name;
    }

    async function showScreen(name) {
      setActive(name);
      document.getElementById('breadcrumb').textContent = screenLabels[name] || name;
      const renderers = {
        overview: renderOverview, orders: renderOrders, cashier: renderCashier, qr: renderQr, menu: renderMenu,
        ingredients: renderIngredients, team: renderTeam, reports: renderReports, payments: renderPayments, billing: renderBilling
      };
      try { await renderers[name](); }
      catch (error) { screen.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; }
    }

    // ---------- Overview ----------
    async function renderOverview() {
      const dashboard = await api('/dashboard?restaurant=' + restaurantId);
      screen.innerHTML = `
        <div class="hero">
          <h1>${escapeHtml(restaurant.name)}</h1>
          <p>Your restaurant workspace</p>
          <span class="pill">Venue ID ${restaurantId}</span>
          <span class="pill">${dashboard.openOrders} active orders</span>
        </div>
        <div class="section-label">At a glance</div>
        <div class="metric-grid">
          <div class="metric"><div class="metric-label">Open orders</div><div class="metric-value">${dashboard.openOrders}</div><div class="metric-note">${dashboard.counts.pending} pending · ${dashboard.counts.ready} ready</div></div>
          <div class="metric"><div class="metric-label">Captured revenue</div><div class="metric-value">${money(dashboard.revenue)}</div><div class="metric-note">Confirmed payments</div></div>
          <div class="metric"><div class="metric-label">Voided</div><div class="metric-value">${(dashboard.counts.void || 0) + (dashboard.counts.rejected || 0)}</div><div class="metric-note">Voided or rejected orders</div></div>
        </div>
      `;
    }

    // ---------- Orders & cashier ----------
    function orderRow(order, cashier) {
      const itemText = Object.entries(order.items || {}).map(([id, qty]) => `${escapeHtml(id)} × ${qty}`).join(' · ') || 'No items';
      const actions = [];
      if (order.status === 'awaiting_payment') actions.push(`<button class="danger" onclick="voidOrder(${order.id})">Void (unpaid)</button>`);
      if (order.status === 'awaiting_confirmation') actions.push(`<span style="font-size:11px;color:var(--muted);">Confirm on the Waitress page</span>`);
      if (order.status === 'pending') actions.push(`<button class="primary" onclick="orderAction(${order.id}, 'approve')">Approve</button>`);
      if (order.status === 'approved') actions.push(`<button class="primary" onclick="orderAction(${order.id}, 'ready')">Mark ready</button>`);
      if (order.status === 'ready') actions.push(`<button class="primary" onclick="orderAction(${order.id}, 'done')">Mark served</button>`);
      if (cashier && order.status === 'done' && !order.paid) actions.push(`<button class="primary" onclick="orderAction(${order.id}, 'pay')">Mark paid</button>`);
      if (!['done', 'void', 'rejected', 'awaiting_payment', 'awaiting_confirmation'].includes(order.status)) actions.push(`<button class="danger" onclick="voidOrder(${order.id})">Void</button>`);
      return `<div class="row"><div><div class="row-title">Table ${escapeHtml(order.table)}<span class="status ${escapeHtml(order.status)}">${escapeHtml(order.status.replace('_', ' '))}</span></div><div class="row-meta">${itemText}${order.paid ? ' · Paid via ' + escapeHtml(methodLabels[order.payment_method] || order.payment_method || '') : ''}</div></div><div class="row-actions">${actions.join('')}</div></div>`;
    }

    async function renderOrders() {
      const orders = await api('/orders?restaurant=' + restaurantId);
      screen.innerHTML = `<div class="screen-head"><div><h1 class="screen-title">Live orders</h1><p>Progress orders from received to served.</p></div><button class="secondary" onclick="showScreen('orders')">Refresh</button></div><div class="list">${orders.length ? orders.slice().reverse().map(o => orderRow(o, false)).join('') : '<div class="empty">No orders yet.</div>'}</div>`;
    }

    async function renderCashier() {
      const orders = await api('/orders?restaurant=' + restaurantId);
      const completed = orders.filter(o => o.status === 'done' && !o.paid);
      screen.innerHTML = `<div class="screen-head"><div><h1 class="screen-title">Cashier</h1><p>Record payments for served orders that are still unpaid.</p></div></div><div class="list">${completed.length ? completed.map(o => orderRow(o, true)).join('') : '<div class="empty">No served orders waiting for payment.</div>'}</div>`;
    }

    async function orderAction(id, action) {
      try {
        await api('/orders/' + id + '/' + action, { method: 'POST' });
        toast('Order updated.');
      } catch (error) { alert(error.message); }
      showScreen(document.querySelector('.nav-item.active').dataset.screen);
    }

    async function voidOrder(id) {
      const reason = prompt('Reason for voiding this order?');
      if (reason === null) return;
      try {
        await api('/orders/' + id + '/void', { method: 'POST', body: JSON.stringify({ reason }) });
        toast('Order voided.');
      } catch (error) { alert(error.message); }
      showScreen(document.querySelector('.nav-item.active').dataset.screen);
    }

    // ---------- Menu ----------
    async function renderMenu() {
      const menu = await api('/menu?restaurant=' + restaurantId);
      screen.innerHTML = `
        <div class="screen-head"><div><h1 class="screen-title">Menu</h1><p>Publish dishes for customers to order.</p></div><button class="primary" onclick="openAddDishModal()">+ Add Dish</button></div>
        <div class="list">${menu.length ? menu.map(item => `
          <div class="row"><div><div class="row-title">${escapeHtml(item.name)} — ${money(item.price)}</div><div class="row-meta">${escapeHtml(item.category || 'Other')} · ${escapeHtml(item.description || '')}</div></div>
          <div class="row-actions"><button class="secondary" onclick="openEditDishModal('${escapeHtml(item.id)}')">Edit</button><button class="danger" onclick="deleteDish('${escapeHtml(item.id)}')">Delete</button></div></div>
        `).join('') : '<div class="empty">No dishes yet — add your first one above.</div>'}</div>
      `;
    }

    async function loadModalIngredients() {
      modalIngredients = await api('/ingredients?restaurant=' + restaurantId);
      const select = document.getElementById('modal-new-ingredient');

    function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
async function drawQrCard(qrDataUrl, { tableLabel, area, zone, venueName }) {
  const W = 800, H = 1150;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const ink = '#1A1712', muted = '#6B6455', line = '#E7E0D2';

  // Card background and border
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 8;
  ctx.strokeStyle = ink;
  roundRect(ctx, 14, 14, W - 28, H - 28, 44);
  ctx.stroke();

  // Title and subtitle
  ctx.textAlign = 'center';
  ctx.fillStyle = ink;
  ctx.font = 'bold 80px Arial, sans-serif';
  ctx.letterSpacing = '14px';
  ctx.fillText('SCAN ME', W / 2 + 7, 135);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = muted;
  ctx.font = 'bold 26px Arial, sans-serif';
  ctx.fillText('Point your camera here to order', W / 2, 195);

  // Area / Zone / Table row
  const cols = [['AREA', area], ['ZONE', zone], ['TABLE / SEAT', tableLabel]];
  const colW = (W - 140) / 3;
  cols.forEach(([label, value], i) => {
    const cx = 70 + colW * i + colW / 2;
    ctx.fillStyle = muted;
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.letterSpacing = '2px';
    ctx.fillText(label, cx, 290);
    ctx.letterSpacing = '0px';
    ctx.fillStyle = ink;
    ctx.font = 'bold 34px Arial, sans-serif';
    ctx.fillText(value || '—', cx, 345, colW - 20);
    if (i > 0) {
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(70 + colW * i, 255);
      ctx.lineTo(70 + colW * i, 360);
      ctx.stroke();
    }
  });

  // Divider
  ctx.strokeStyle = line;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(70, 395);
  ctx.lineTo(W - 70, 395);
  ctx.stroke();

  // Corner brackets around the QR
  const bx = 100, by = 430, bs = 600, bl = 80;
  ctx.strokeStyle = ink;
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  [[bx, by, 1, 1], [bx + bs, by, -1, 1], [bx, by + bs, 1, -1], [bx + bs, by + bs, -1, -1]].forEach(([x, y, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(x + dx * bl, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + dy * bl);
    ctx.stroke();
  });

  // The QR code itself
  const qrImg = await loadImage(qrDataUrl);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(qrImg, 140, 470, 520, 520);

  // Footer
  ctx.fillStyle = ink;
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillText(venueName || '', W / 2, 1075, W - 160);
  ctx.fillStyle = muted;
  ctx.font = '22px Arial, sans-serif';
  ctx.fillText('Powered by Meza', W / 2, 1110);

  return canvas.toDataURL('image/png');
}

    function setReportRange(kind) {
      const today = new Date();
      reportTo = isoDate(today);
      if (kind === 'today') {
        reportFrom = reportTo;
      } else if (kind === 'week') {
        const start = new Date(today);
        start.setDate(start.getDate() - ((today.getDay() + 6) % 7));
        reportFrom = isoDate(start);
      } else if (kind === 'month') {
        reportFrom = isoDate(new Date(today.getFullYear(), today.getMonth(), 1));
      } else {
        reportFrom = '2000-01-01';
      }
      renderReports();
    }

              <div>
                <div class="row-title">Table ${escapeHtml(v.table)}<span class="status ${escapeHtml(v.status)}">${escapeHtml(v.status)}</span>${v.refund_due ? '<span class="status void">refund due</span>' : ''}</div>
                <div class="row-meta">${formatDateTime(v.created_at)} · ${escapeHtml(v.items)}${v.reason ? ' · Reason: ' + escapeHtml(v.reason) : ''}</div>
              </div>
              <div class="row-title">${money(v.total)}</div>
            </div>`).join('')
        : '<div class="empty">No voided orders in this period.</div>';

      const expenseRows = r.expenses.length
        ? r.expenses.map(e => `
            <div class="row">
              <div><div class="row-title">${escapeHtml(e.category || 'Expense')} — ${money(e.amount)}</div><div class="row-meta">${escapeHtml(e.expense_date)}${e.description ? ' · ' + escapeHtml(e.description) : ''}</div></div>
              <div class="row-actions"><button class="danger" onclick="deleteExpense(${e.id})">Delete</button></div>
            </div>`).join('')
        : '<div class="empty">No expenses recorded in this period.</div>';

      screen.innerHTML = `
        <div class="screen-head"><div><h1 class="screen-title">Reports</h1><p>Sales, voids, and profit for the period you choose.</p></div></div>

        <div class="card">
          <div class="form-grid">
            <div class="field"><label>From</label><input id="rep-from" type="date" value="${reportFrom === '2000-01-01' ? '' : reportFrom}"></div>
            <div class="field"><label>To</label><input id="rep-to" type="date" value="${reportTo}"></div>
          </div>
          <div class="button-row">
            <button class="primary" onclick="applyReportRange()">Apply</button>
            <button class="secondary" onclick="setReportRange('today')">Today</button>
            <button class="secondary" onclick="setReportRange('week')">This week</button>
            <button class="secondary" onclick="setReportRange('month')">This month</button>
            <button class="secondary" onclick="setReportRange('all')">All time</button>
          </div>
        </div>
        ${costWarning}

        <div class="section-label">Profit & loss</div>
        <div class="metric-grid">
          <div class="metric"><div class="metric-label">Revenue</div><div class="metric-value">${money(r.revenue)}</div><div class="metric-note">${r.orderCount} paid orders</div></div>
          <div class="metric"><div class="metric-label">Cost of food</div><div class="metric-value">${money(r.cogs)}</div><div class="metric-note">Ingredients used in sold dishes</div></div>
          <div class="metric"><div class="metric-label">Gross profit</div><div class="metric-value">${money(r.grossProfit)}</div><div class="metric-note">Revenue minus cost of food</div></div>
          <div class="metric"><div class="metric-label">Waste from voids</div><div class="metric-value">${money(r.waste)}</div><div class="metric-note">Ingredients used on voided orders</div></div>
          <div class="metric"><div class="metric-label">Expenses</div><div class="metric-value">${money(r.expensesTotal)}</div><div class="metric-note">${r.expenses.length} entries</div></div>
          <div class="metric"><div class="metric-label">Net profit / loss</div><div class="metric-value" style="color:${netColor};">${money(r.netProfit)}</div><div class="metric-note">After food, waste and expenses</div></div>
        </div>

        <div class="section-label">Sales by payment method</div>
        <div class="list">${methodRows}</div>

        <div class="section-label">Most ordered items</div>
        <div class="list">${itemRows}</div>

        <div class="section-label">Void report</div>
        <div class="metric-grid">
          <div class="metric"><div class="metric-label">Voided orders</div><div class="metric-value">${r.voids.length}</div><div class="metric-note">Voided or rejected</div></div>
          <div class="metric"><div class="metric-label">Voided value</div><div class="metric-value">${money(r.voidedValue)}</div><div class="metric-note">Sales that did not happen</div></div>
          <div class="metric"><div class="metric-label">Refunds due</div><div class="metric-value">${money(r.refundsDue)}</div><div class="metric-note">Paid orders that were voided</div></div>
        </div>
        <div class="list" style="margin-top:14px;">${voidRows}</div>

        <div class="section-label">Expenses</div>
        <div class="card">
          <div class="form-grid">
            <div class="field"><label>Date</label><input id="exp-date" type="date" value="${reportTo}"></div>
            <div class="field"><label>Category</label><input id="exp-category" placeholder="Rent, salaries, electricity..."></div>
            <div class="field"><label>Description</label><input id="exp-description" placeholder="Optional note"></div>
            <div class="field"><label>Amount (RWF)</label><input id="exp-amount" type="number" min="0"></div>
          </div>
          <div class="button-row"><button class="primary" onclick="addExpense()">Add expense</button></div>
        </div>
        <div class="list" style="margin-top:14px;">${expenseRows}</div>

        <div class="section-label">Download as CSV</div>
        <div class="button-row" style="margin-top:0;">
          <button class="secondary" onclick="exportReport('summary')">Summary</button>
          <button class="secondary" onclick="exportReport('sales')">Sales</button>
          <button class="secondary" onclick="exportReport('voids')">Voids</button>
          <button class="secondary" onclick="exportReport('expenses')">Expenses</button>
        </div>
      `;
    }

    // ---------- Payment setup ----------
    function renderPayments() {
      screen.innerHTML = `
        <div class="screen-head"><div><h1 class="screen-title">Payment Setup</h1><p>Numbers customers will send payment to.</p></div></div>
        <div class="card">
          <div class="form-grid">
            <div class="field"><label>MTN MoMo number</label><input id="pay-momo" value="${escapeHtml(restaurant.momo_number || '')}" placeholder="e.g. 0788123456"></div>
            <div class="field"><label>Airtel Money number</label><input id="pay-airtel" value="${escapeHtml(restaurant.airtel_number || '')}" placeholder="e.g. 0738123456"></div>
            <div class="field"><label>Urubuto Pay code</label><input id="pay-urubuto" value="${escapeHtml(restaurant.urubuto_code || '')}" placeholder="Merchant code"></div>
          </div>
          <div class="button-row"><button class="primary" onclick="savePaymentDetails()">Save</button></div>
        </div>
      `;
    }

    function savePaymentDetails() {
      const momo_number = document.getElementById('pay-momo').value;
      const airtel_number = document.getElementById('pay-airtel').value;
      const urubuto_code = document.getElementById('pay-urubuto').value;
      api('/restaurants/' + restaurantId + '/payment-details', { method: 'PUT', body: JSON.stringify({ momo_number, airtel_number, urubuto_code }) })
        .then(() => {
          restaurant.momo_number = momo_number;
          restaurant.airtel_number = airtel_number;
          restaurant.urubuto_code = urubuto_code;
          toast('Payment details saved.');
        });
    }

    // ---------- Billing ----------
    function renderBilling() {
      const qrCount = Number(restaurant.number_of_tables || 0);
      const currentPlan = restaurant.plan || 'Free';
      const plans = [
        { name: 'Free', range: '1–5 QR codes', price: 'RWF 0/mo' },
        { name: 'Starter', range: '6–15 QR codes', price: 'RWF 17,000/mo' },
        { name: 'Standard', range: '16–25 QR codes', price: 'RWF 32,000/mo' },
        { name: 'Business', range: '26–40 QR codes', price: 'RWF 47,000/mo' },
        { name: 'Premium', range: '41–60 QR codes', price: 'RWF 77,000/mo' },
        { name: 'Professional', range: '61–100 QR codes', price: 'RWF 145,000/mo' },
        { name: 'Enterprise', range: '101+ QR codes', price: '2% of eligible sales' }
      ];

      screen.innerHTML = `
        <div class="screen-head"><div><h1 class="screen-title">Platform Billing</h1><p>Manage your venue subscription and QR code plan.</p></div></div>
        <div class="billing-wrap">
          <div class="billing-card">
            <div class="billing-top">
              <div>
                <div class="billing-label">Subscription plan</div>
                <div class="billing-plan-name">${currentPlan}</div>
                <div class="billing-subtext">${qrCount} active QR codes</div>
              </div>
              <span class="billing-status">Active</span>
            </div>
            <div class="section-label">Available plans</div>
            <div class="plan-list">
              ${plans.map(plan => `
                <div class="plan-option ${plan.name === currentPlan ? 'current' : ''}">
                  <div>
                    <div class="plan-name">${plan.name}${plan.name === currentPlan ? '<span class="current-text">CURRENT</span>' : ''}</div>
                    <div class="plan-description">${plan.range} · ${plan.price}</div>
                  </div>
                  ${plan.name !== currentPlan ? `<button class="secondary" onclick="changePlan('${plan.name}')">Select</button>` : ''}
                </div>
              `).join('')}
            </div>
            <div class="billing-footnote">This selects your plan tier immediately. Real payment collection isn't connected yet — that's a separate step for launch.</div>
          </div>
        </div>
      `;
    }

    async function changePlan(planName) {
      if (!confirm('Switch to the ' + planName + ' plan?')) return;
      await api('/restaurants/' + restaurantId + '/plan', { method: 'PUT', body: JSON.stringify({ plan: planName }) });
      restaurant.plan = planName;
      toast('Plan updated to ' + planName + '.');
      showScreen('billing');
    }

    // ---------- Session ----------
    async function signOut() {
      await api('/logout', { method: 'POST' });
      window.location.href = 'login.html';
    }

    async function start() {
      try {
        const sessionData = await api('/admin/me');
        restaurantId = sessionData.restaurantId;
        await loadRestaurant();
        showScreen('overview');
      } catch {
        window.location.href = 'login.html';
      }
    }

    start();
  </script>
</body>
</html>
