<!DOCTYPE html>
<html>
<head>
    <title>Sign in — Meza</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23A8371E'/><text x='50' y='68' font-size='58' fill='%23FAF6EE' text-anchor='middle' font-family='sans-serif' font-weight='800'>M</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
    <style>
        .staff-header {
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    padding: 20px;
}

.staff-body {
    width: 100%;
    box-sizing: border-box;
    padding: 20px;
}

.staff-body .panel {
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
    box-sizing: border-box;
    text-align: center;
}

.staff-body .field-group {
    width: 100%;
    margin-bottom: 18px;
    text-align: center;
}

.staff-body .field-group label {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    margin-bottom: 10px;
}

.staff-body .field-group input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 0;
}

.staff-body .btn-success {
    display: block;
    margin: 0 auto;
    padding: 12px 24px;
    cursor: pointer;
}
    </style>
<body>
    <div class="staff-header">
        <h1>Sign in to Meza</h1>
        <p>Manage your restaurant</p>
    </div>

    <div class="staff-body">
        <div class="panel">
            <div class="field-group">
                <label>Email</label>
                <input type="text" id="email" placeholder="you@yourrestaurant.com">
            </div>
            <div class="field-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Your password">
                <p style="margin-top:8px;"><a href="forgot-password.html">Forgot password ?</a></p>
            </div>
            <button class="btn-success" onclick="login()">Sign in</button>
            <p style="margin-top:14px;">No account? <a href="register.html">Create a restaurant</a></p>
        </div>
    </div>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    window.location.href = 'admin.html?restaurant=' + data.restaurantId;
                }
            });
        }
    </script>
</body>
</html>
