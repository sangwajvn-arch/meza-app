<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitress View</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23A8371E'/><text x='50' y='68' font-size='58' fill='%23FAF6EE' text-anchor='middle' font-family='sans-serif' font-weight='800'>M</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>.staff-topbar{display:flex;justify-content:space-between;align-items:center;}</style>
</head>
<body>
    <div class="staff-header">
        <div class="staff-topbar">
            <div>
                <h1>Waitress View</h1>
                <p id="restaurant-label">Loading restaurant…</p>
            </div>
            <button class="btn-ghost" onclick="staffSignOut()" style="color:var(--bone);border-color:rgba(250,246,238,0.3);">Sign out</button>
        </div>
    </div>

    <div class="staff-body">
        <div class="section-heading">Pending Orders</div>
        <div id="orders-list" class="ticket-grid"></div>

        <div class="section-heading">Ready to Serve</div>
        <div id="ready-list" class="ticket-grid"></div>

        <div class="section-heading">Table Requests</div>
        <div id="requests-list" class="ticket-grid"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const restaurantId = params.get('restaurant');
        let sessionOk = false;

        function staffSignOut() {
            fetch('/staff-logout', { method: 'POST' }).then(() => window.location.href = 'staff-login.html?restaurant=' + restaurantId);
        }

        async function checkSession() {
            try {
                const res = await fetch('/staff/me');
                const data = await res.json();
                if (!res.ok || data.role !== 'waitress' || String(data.restaurantId) !== String(restaurantId)) {
                    window.location.href = 'staff-login.html?restaurant=' + restaurantId;
                    return;
                }
                sessionOk = true;
                document.getElementById('restaurant-label').textContent = 'Signed in as ' + data.name;
                loadOrders();
                loadRequests();
                setInterval(loadOrders, 3000);
                setInterval(loadRequests, 3000);
            } catch (e) {
                window.location.href = 'staff-login.html?restaurant=' + restaurantId;
            }
        }

        function loadOrders() {
            if (!sessionOk) return;
            Promise.all([
                fetch('/orders?restaurant=' + restaurantId).then(r => r.json()),
                fetch('/menu?restaurant=' + restaurantId).then(r => r.json())
            ]).then(([orders, menu]) => {
                renderSection(orders, menu, 'pending', 'orders-list', order =>
                    '<button class="btn-success" onclick="approveOrder(' + order.id + ')">Approve</button> ' +
                    '<button class="btn-danger" onclick="notifyUnavailable(' + order.id + ', \'' + order.table + '\')">Item not available</button>'
                );
                renderSection(orders, menu, 'ready', 'ready-list', order =>
                    '<button class="btn-success" onclick="markServed(' + order.id + ')">Mark as served</button>'
                );
            });
        }

        function renderSection(orders, menu, status, containerId, buttonHtml) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const filtered = orders.filter(o => o.status === status);
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No orders here right now.</div>';
                return;
            }
            filtered.forEach(order => {
                const div = document.createElement('div');
                div.className = 'ticket' + (status === 'ready' ? ' ready' : '');
                let itemsText = '';
                for (let id in order.items) {
                    const dish = menu.find(m => m.id === id);
                    itemsText += (dish ? dish.name : id) + ' × ' + order.items[id] + '<br>';
                }
                div.innerHTML = `
                    <div class="ticket-table">Table ${order.table}</div>
                    <div class="ticket-items">${itemsText}</div>
                    <div class="ticket-actions">${buttonHtml(order)}</div>
                `;
                container.appendChild(div);
            });
        }

        function approveOrder(id) {
            fetch('/orders/' + id + '/approve', { method: 'POST' })
                .then(response => response.json())
                .then(data => { if (data.error) alert(data.error); loadOrders(); });
        }

        function markServed(orderId) {
            fetch('/orders/' + orderId + '/done', { method: 'POST' }).then(() => loadOrders());
        }

        function notifyUnavailable(orderId, table) {
            const dish = prompt('Which dish is not available?');
            if (!dish) return;
            fetch('/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    restaurant_id: restaurantId, table: table,
                    text: 'Sorry, "' + dish + '" is not available right now. Please place a new order with something else.'
                })
            })
            .then(() => fetch('/orders/' + orderId + '/reject', { method: 'POST' }))
            .then(() => loadOrders());
        }

        function loadRequests() {
            if (!sessionOk) return;
            fetch('/requests?restaurant=' + restaurantId)
                .then(response => response.json())
                .then(requests => {
                    const container = document.getElementById('requests-list');
                    container.innerHTML = '';
                    if (requests.length === 0) {
                        container.innerHTML = '<div class="empty-state">No requests right now.</div>';
                        return;
                    }
                    requests.forEach(r => {
                        const label = r.type === 'call_waiter' ? '🖐 Wants a waiter' : '🧾 Requests the bill';
                        const div = document.createElement('div');
                        div.className = 'ticket';
                        div.innerHTML = `
                            <div class="ticket-table">Table ${r.table_number}</div>
                            <div class="ticket-items">${label}</div>
                            <div class="ticket-actions"><button class="btn-success" onclick="resolveRequest(${r.id})">Resolved</button></div>
                        `;
                        container.appendChild(div);
                    });
                });
        }

        function resolveRequest(id) {
            fetch('/requests/' + id + '/resolve', { method: 'POST' }).then(() => loadRequests());
        }
        

       checkSession();
    </script>
</body>
</html>
