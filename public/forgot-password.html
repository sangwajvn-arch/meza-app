<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password — Meza</title>
    <link rel="stylesheet" href="style.css">
      <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23A8371E'/><text x='50' y='68' font-size='58' fill='%23FAF6EE' text-anchor='middle' font-family='sans-serif' font-weight='800'>M</text></svg>">
</head>
    <style>
        .staff-header {
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    padding: 20px;
}

.staff-body {
    width: 100%;
    box-sizing: border-box;
    padding: 20px;
}

.staff-body .panel {
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
    box-sizing: border-box;
    text-align: center;
}

.staff-body .field-group {
    width: 100%;
    margin-bottom: 18px;
    text-align: center;
}

.staff-body .field-group label {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    margin-bottom: 10px;
}

.staff-body .field-group input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 0;
}

.staff-body .btn-success {
    display: block;
    margin: 0 auto;
    padding: 12px 24px;
    cursor: pointer;
}
    </style>
<body>
    <div class="staff-header">
        <h1>Forgot your password?</h1>
        <p>We'll email you a reset link</p>
    </div>
    <div class="staff-body">
        <div class="panel" id="form-panel">
            <div class="field-group">
                <label>Email</label>
                <input type="text" id="email" placeholder="you@yourrestaurant.com">
            </div>
            <button class="btn-success" onclick="sendReset()">Send reset link</button>
            <p style="margin-top:14px;"><a href="login.html">← Back to sign in</a></p>
        </div>
        <div class="panel" id="sent-panel" style="display:none;">
            <p>If an account with that email exists, we've sent a password reset link. The link expires in 15 minutes.</p>
            <p><a href="login.html">← Back to sign in</a></p>
        </div>
    </div>
    <script>
        function sendReset() {
            const email = document.getElementById('email').value;
            fetch('/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            }).then(() => {
                document.getElementById('form-panel').style.display = 'none';
                document.getElementById('sent-panel').style.display = 'block';
            });
        }
    </script>
</body>
</html>
