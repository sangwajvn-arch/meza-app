<!DOCTYPE html>
<html>
<head>
    <title>Reset password — Meza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="staff-header">
        <h1>Set a new password</h1>
        <p>Pick something at least 8 characters long</p>
    </div>
    <div class="staff-body">
        <div class="panel">
            <div class="field-group">
                <label>New password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
            </div>
            <div class="field-group">
                <label>Confirm password</label>
                <input type="password" id="confirm" placeholder="Type it again">
            </div>
            <button class="btn-success" onclick="resetPassword()">Update password</button>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        function resetPassword() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password.length < 8) {
                alert('Password must be at least 8 characters.');
                return;
            }
            if (password !== confirm) {
                alert('Passwords do not match.');
                return;
            }

            fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    alert('Password updated. You can now sign in.');
                    window.location.href = 'login.html';
                }
            });
        }
    </script>
</body>
</html>
