<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1712">
<title>Offline — Meza</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; background: #FAF6EE; color: #1A1712; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .box { max-width: 340px; }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px; background: #A8371E; color: #FAF6EE; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 22px; color: #6B6455; font-size: 15px; line-height: 1.5; }
  button { min-height: 50px; padding: 0 28px; border: 0; border-radius: 26px; background: #1A1712; color: #FAF6EE; font: 700 16px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">M</div>
  <h1>You are offline</h1>
  <p>This page has not been saved on your phone yet. Check your internet connection, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
